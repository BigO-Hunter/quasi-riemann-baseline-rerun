name: Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-rerun:
    name: Independent openai-baseline rerun (Challenge + Solution + Submissions)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - name: Check out the receipt repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install elan and Lean v4.34.1 (sources/lean-toolchain)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Stage the rebuild workspace from the tracker pin
        run: |
          mkdir -p /tmp/qr_rebuild
          git init -q /tmp/qr_rebuild/tracker
          git -C /tmp/qr_rebuild/tracker fetch --depth 1 https://github.com/GTimG/QuasiRiemannTracker.git 47134867e2ce4d4a311d2da93783c2ae721d9bb9
          git -C /tmp/qr_rebuild/tracker checkout -q FETCH_HEAD
          python3 scripts/stage_workspace.py
      - name: Fetch dependencies, apply the lean4341 compatibility patches, get the Mathlib cache
        working-directory: /tmp/qr_rebuild/workspace
        run: |
          lake update
          git -C .lake/packages/PrimeNumberTheoremAnd apply "$GITHUB_WORKSPACE/pr103-rerun/patches/PrimeNumberTheoremAnd-lean4341.patch"
          git -C .lake/packages/rellich-kondrachov apply "$GITHUB_WORKSPACE/pr103-rerun/patches/rellich-kondrachov-lean4341.patch"
          lake exe cache get
      - name: Build the full rerun (Challenge, Candidate, Solution, Submissions)
        working-directory: /tmp/qr_rebuild/workspace
        run: lake build
      - name: Axiom probes on the built solution
        working-directory: /tmp/qr_rebuild/workspace
        run: lake env lean Axioms.lean
      - name: Verify the vendored tree against openai/math at the upstream pin
        run: |
          git init -q /tmp/qr_rebuild/openai-src
          git -C /tmp/qr_rebuild/openai-src fetch --depth 1 https://github.com/openai/math.git fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb
          git -C /tmp/qr_rebuild/openai-src checkout -q FETCH_HEAD
          python3 scripts/verify_upstream.py
